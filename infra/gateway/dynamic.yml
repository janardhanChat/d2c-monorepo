# Traefik routing: one public entrypoint, path-based routing to services.
# /internal/* routes are NOT exposed here: they are service-to-service only.
http:
  routers:
    core:
      rule: "PathPrefix(`/api/core`) && !PathRegexp(`^/api/core/internal`)"
      service: core-api
      middlewares: [strip-api]
    integrations:
      rule: "PathPrefix(`/api/integrations`) && !PathRegexp(`^/api/integrations/internal`)"
      service: integrations-api
      middlewares: [strip-api]
    social:
      rule: "PathPrefix(`/api/social`) && !PathRegexp(`^/api/social/internal`)"
      service: social-api
      middlewares: [strip-api]

    web:
      rule: "PathPrefix(`/`)"
      service: web
      priority: 1

  middlewares:
    strip-api:
      stripPrefixRegex:
        regex: ["^/api/[a-z-]+"]

  services:
    core-api:
      loadBalancer: { servers: [{ url: "http://core-api:4000" }] }
    integrations-api:
      loadBalancer: { servers: [{ url: "http://integrations-api:4010" }] }
    social-api:
      loadBalancer: { servers: [{ url: "http://social-api:4100" }] }

    web:
      loadBalancer: { servers: [{ url: "http://web:3000" }] }
