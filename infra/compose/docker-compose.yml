# Our application stack. Supabase and Postiz run from their own upstream compose files
# (infra/supabase, infra/postiz) and join the shared "ap-net" network.
#
#   docker network create ap-net        # once
#   pnpm infra:up
#
name: automation-platform

x-node-service: &node-service
  build:
    context: ../..
    dockerfile: infra/docker/node-service.Dockerfile
  restart: unless-stopped
  env_file: ../../.env
  networks: [ap-net]

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: ../../.env
    networks: [ap-net]

  core-api:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args: { PACKAGE: "@ap/core-api" }
    ports: ["4000:4000"]
    environment: { PORT: 4000 }

  integrations-api:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args: { PACKAGE: "@ap/integrations-api" }
    ports: ["4010:4010"]
    environment: { PORT: 4010, CORE_API_URL: http://core-api:4000 }

  social-api:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args: { PACKAGE: "@ap/social-api" }
    ports: ["4100:4100"]
    environment:
      PORT: 4100
      CORE_API_URL: http://core-api:4000
      INTEGRATIONS_API_URL: http://integrations-api:4010

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [ap-net]

volumes:
  redis-data:

networks:
  ap-net:
    external: true
